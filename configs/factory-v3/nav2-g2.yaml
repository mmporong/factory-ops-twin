/**:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

map_server:
  ros__parameters:
    yaml_filename: /workspace/project/runs/local/maps/map.yaml
    topic_name: map
    frame_id: map
navigation_map_server:
  ros__parameters:
    yaml_filename: /workspace/results/G2_MAPS/navigation.yaml
    topic_name: navigation_map
    frame_id: map
amcl:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan_localization
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_max_range: 30.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    min_particles: 500
    max_particles: 1500
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    z_hit: 0.95
    z_rand: 0.05
    sigma_hit: 0.15
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
    always_reset_initial_pose: true
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names: [compute_path_error_code, follow_path_error_code]
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.15
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.4
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 2.0
      rotate_to_heading_min_angle: 0.5
      transform_tolerance: 0.5
      use_rotate_to_heading: true
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      cost_scaling_dist: 0.5
      cost_scaling_gain: 0.5
      inflation_cost_scaling_factor: 3.0
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_robot_pose_search_dist: 10.0
smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    wait: {plugin: nav2_behaviors::Wait}
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    max_rotational_vel: 0.6
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.8
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 1.14
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: navigation_map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: front rear
        front: {topic: scan_front, data_type: LaserScan, marking: true, clearing: true, inf_is_valid: false, obstacle_min_range: 0.1, obstacle_max_range: 12.0, raytrace_min_range: 0.1, raytrace_max_range: 15.0}
        rear: {topic: scan_rear, data_type: LaserScan, marking: true, clearing: true, inf_is_valid: false, obstacle_min_range: 0.1, obstacle_max_range: 12.0, raytrace_min_range: 0.1, raytrace_max_range: 15.0}
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.34
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      robot_radius: 1.14
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: navigation_map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: front rear
        front: {topic: scan_front, data_type: LaserScan, marking: true, clearing: true, inf_is_valid: false, obstacle_min_range: 0.1, obstacle_max_range: 12.0, raytrace_min_range: 0.1, raytrace_max_range: 15.0}
        rear: {topic: scan_rear, data_type: LaserScan, marking: true, clearing: true, inf_is_valid: false, obstacle_min_range: 0.1, obstacle_max_range: 12.0, raytrace_min_range: 0.1, raytrace_max_range: 15.0}
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.34
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
